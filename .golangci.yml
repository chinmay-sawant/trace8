# golangci-lint configuration for trace8.
#
# Curated on purpose. The previous file enabled every linter (inherited from
# gowkhtmltopdf) and produced 1000+ style findings (wsl, nlreturn, varnamelen,
# exhaustruct, mnd) that are not defects. The set below catches real problems
# and stays green; see plans/0.0.1/local-keyword-store.md, Lint evidence.
#
# Toolchain note: this module is go 1.26 / toolchain go1.26.4.
# golangci-lint must be built with Go >= the module version (see Makefile).

run:
  timeout: 10m
  tests: true

linters:
  disable-all: true
  enable:
    - errcheck     # unchecked errors
    - govet        # stdlib vet suite
    - ineffassign  # ineffectual assignments
    - staticcheck  # correctness and simplification
    - unused       # unused code
    - misspell     # typos in comments and strings
    - errorlint    # error wrapping and comparison
    - bodyclose    # HTTP response bodies are closed
    - unconvert    # unnecessary conversions
    - wastedassign # assignments that are never read
    - copyloopvar  # unneeded loop variable copies since Go 1.22

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

output:
  sort-results: true
